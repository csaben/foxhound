[package]
name = "foxhound-helper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local HTTP helper for unfocused native-window capture and input."

[[bin]]
name = "foxhound-helper"
path = "src/main.rs"

[dependencies]
foxhound-capture = { path = "../foxhound-capture" }
foxhound-input = { path = "../foxhound-input" }
foxhound-window = { path = "../foxhound-window" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
